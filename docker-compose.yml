#version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: itam
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: itam_pass
    volumes:
      - pg:/var/lib/postgresql/data
      - ./db/init.sql :/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://itam:itam_pass@postgres:5432/itam
    depends_on: [postgres]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itam_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@itam.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

volumes:
  pg:
  pgadmin_data:


